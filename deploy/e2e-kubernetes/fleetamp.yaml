apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fleetamp-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: fleetamp
  labels:
    app.kubernetes.io/name: fleetamp
spec:
  selector:
    app.kubernetes.io/name: fleetamp
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: opamp
      port: 4320
      targetPort: opamp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleetamp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fleetamp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleetamp
        app.kubernetes.io/part-of: fleetamp-e2e
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: fleetamp
          image: fleetamp:e2e
          imagePullPolicy: Never
          env:
            - name: FLEETAMP_HTTP_ADDR
              value: 0.0.0.0:8080
            - name: FLEETAMP_OPAMP_ADDR
              value: 0.0.0.0:4320
            - name: FLEETAMP_ALLOW_INSECURE
              value: "true"
            - name: FLEETAMP_ALLOWED_ORIGINS
              value: "http://localhost:18081,http://127.0.0.1:18081"
            - name: FLEETAMP_DATA_DIR
              value: /var/lib/fleetamp
            - name: FLEETAMP_DATABASE_PATH
              value: /var/lib/fleetamp/fleetamp.db
            - name: FLEETAMP_LOG_FORMAT
              value: json
            - name: FLEETAMP_LOG_LEVEL
              value: info
          ports:
            - name: http
              containerPort: 8080
            - name: opamp
              containerPort: 4320
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - name: data
              mountPath: /var/lib/fleetamp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fleetamp-data
