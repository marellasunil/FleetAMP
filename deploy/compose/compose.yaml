name: otelplane-lab
services:
  otelplane:
    build:
      context: ../..
      args:
        VERSION: dev
    image: otelplane:local
    environment:
      OTELPLANE_HTTP_ADDR: 127.0.0.1:8080
      OTELPLANE_OPAMP_ADDR: 127.0.0.1:14320
      OTELPLANE_DATA_DIR: /var/lib/otelplane
      OTELPLANE_DATABASE_PATH: /var/lib/otelplane/otelplane.db
      OTELPLANE_LOG_FORMAT: json
    ports:
      - "127.0.0.1:18080:18080"
    volumes:
      - otelplane-data:/var/lib/otelplane
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web-proxy:
    image: nginx:1.29-alpine
    network_mode: "service:otelplane"
    depends_on:
      otelplane:
        condition: service_started
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  collector:
    image: otelplane-opamp-supervisor:0.149.0
    network_mode: "service:otelplane"
    depends_on:
      otelplane:
        condition: service_started
    volumes:
      - ./supervisor.yaml:/etc/otelplane-supervisor/supervisor.yaml:ro
      - supervisor-data:/var/lib/otel-supervisor

volumes:
  otelplane-data:
  supervisor-data:
