name: Build offline OCB builder image

on:
  workflow_dispatch:
    inputs:
      collector_version:
        description: Exact Collector/OCB version without a v prefix
        required: true
        type: string
      go_image:
        description: Official golang:1.26.0-bookworm image pinned by sha256 digest
        required: true
        type: string
      publish:
        description: Publish the verified image to GHCR
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: ocb-builder-${{ inputs.collector_version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fleetamp-ocb-builder
      LOCAL_TAG: fleetamp-ocb-builder:verification
    steps:
      - name: Validate immutable inputs
        env:
          COLLECTOR_VERSION: ${{ inputs.collector_version }}
          GO_IMAGE: ${{ inputs.go_image }}
        run: |
          set -eu
          printf '%s' "$COLLECTOR_VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          printf '%s' "$GO_IMAGE" | grep -Eq '^docker\.io/library/golang:1\.26\.0-bookworm@sha256:[0-9a-f]{64}$'

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and verify without publication
        if: ${{ inputs.publish == false }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/ocb-builder/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.LOCAL_TAG }}
          build-args: |
            GO_IMAGE=${{ inputs.go_image }}
            COLLECTOR_VERSION=${{ inputs.collector_version }}
            REVISION=${{ github.sha }}

      - name: Smoke-test local image
        if: ${{ inputs.publish == false }}
        run: docker run --rm --network=none --read-only "$LOCAL_TAG" --version

      - name: Build and publish verified image
        id: publish
        if: ${{ inputs.publish }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/ocb-builder/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE_NAME }}:${{ inputs.collector_version }}
          build-args: |
            GO_IMAGE=${{ inputs.go_image }}
            COLLECTOR_VERSION=${{ inputs.collector_version }}
            REVISION=${{ github.sha }}

      - name: Attest published image provenance
        if: ${{ inputs.publish }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Record FleetAMP configuration value
        if: ${{ inputs.publish }}
        run: |
          echo "FLEETAMP_DISTRIBUTION_OCB_IMAGE=${IMAGE_NAME}@${{ steps.publish.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
