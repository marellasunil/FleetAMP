name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Unit tests
        run: go test ./...

      - name: Race detector
        run: go test -race ./...

      - name: Static analysis
        run: go vet ./...

      - name: Vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...
